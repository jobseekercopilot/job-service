openapi: 3.0.1
info:
  contact:
    name: Jobseeker Copilot
  description: |
    Service for searching and retrieving job listings.

    This service acts as a facade over external job sources (via reed-gateway).
    It transforms user profile data (aspirations, work preferences) into
    search requests and returns job results.

    This service does NOT:
    - Store jobs in a local database
    - Call external APIs directly
    - Index or rank jobs
  license:
    name: Proprietary source-available
  title: Jobseeker Copilot - Job Service API
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:8086
tags:
- description: Endpoints for searching job listings
  name: Job Search
paths:
  /api/jobs/search:
    post:
      description: "Searches for jobs based on user aspirations and work preferences.\
        \ Requires X-User-Id header for authentication. This endpoint validates the\
        \ request, transforms it to the external API format, and returns matching\
        \ job listings."
      operationId: searchJobs
      parameters:
      - description: User ID for authentication
        example: user-123
        explode: false
        in: header
        name: X-User-Id
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSearchRequest"
        required: true
      responses:
        "503":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Service Unavailable
        "400":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Bad Request
        "500":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal Server Error
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReedJobSearchResponse"
          description: OK
      summary: Search for jobs
      tags:
      - Job Search
      x-content-type: application/json
      x-accepts:
      - '*/*'
components:
  schemas:
    ErrorResponse:
      example:
        error: error
        message: message
      properties:
        error:
          type: string
        message:
          type: string
      type: object
    Aspirations:
      description: "User aspirations for job search including desired roles, locations,\
        \ and salary expectations"
      example:
        desiredRoles:
        - desiredRoles
        - desiredRoles
        industries:
        - industries
        - industries
        salaryExpectation:
          min: 0
          max: 6
          currency: currency
        locations:
        - locations
        - locations
      properties:
        desiredRoles:
          items:
            type: string
          type: array
        industries:
          items:
            type: string
          type: array
        salaryExpectation:
          $ref: "#/components/schemas/SalaryExpectation"
        locations:
          items:
            type: string
          type: array
      type: object
    JobSearchRequest:
      description: Job search criteria based on user profile
      example:
        aspirations:
          desiredRoles:
          - desiredRoles
          - desiredRoles
          industries:
          - industries
          - industries
          salaryExpectation:
            min: 0
            max: 6
            currency: currency
          locations:
          - locations
          - locations
        workPreferences:
          employmentType:
          - employmentType
          - employmentType
          remotePreference: remotePreference
          companySize:
          - companySize
          - companySize
          culture:
          - culture
          - culture
      properties:
        aspirations:
          $ref: "#/components/schemas/Aspirations"
        workPreferences:
          $ref: "#/components/schemas/WorkPreferences"
      required:
      - aspirations
      type: object
    SalaryExpectation:
      example:
        min: 0
        max: 6
        currency: currency
      properties:
        min:
          format: int32
          type: integer
        max:
          format: int32
          type: integer
        currency:
          type: string
      type: object
    WorkPreferences:
      description: Work preferences including employment types and location preferences
      example:
        employmentType:
        - employmentType
        - employmentType
        remotePreference: remotePreference
        companySize:
        - companySize
        - companySize
        culture:
        - culture
        - culture
      properties:
        employmentType:
          items:
            type: string
          type: array
        remotePreference:
          type: string
        companySize:
          items:
            type: string
          type: array
        culture:
          items:
            type: string
          type: array
      type: object
    Job:
      example:
        id: id
        title: title
        company: company
        location: location
        salary:
          min: 0
          max: 6
          currency: currency
        employmentType: employmentType
        postedDate: postedDate
        description: description
        url: url
        matchScore: 1.4658129805029452
      properties:
        id:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        salary:
          $ref: "#/components/schemas/JobSalary"
        employmentType:
          type: string
        postedDate:
          type: string
        description:
          type: string
        url:
          type: string
        matchScore:
          format: double
          type: number
      type: object
    JobSalary:
      example:
        min: 0
        max: 6
        currency: currency
      properties:
        min:
          format: int32
          type: integer
        max:
          format: int32
          type: integer
        currency:
          type: string
      type: object
    ReedJobSearchResponse:
      example:
        jobs:
        - id: id
          title: title
          company: company
          location: location
          salary:
            min: 0
            max: 6
            currency: currency
          employmentType: employmentType
          postedDate: postedDate
          description: description
          url: url
          matchScore: 1.4658129805029452
        - id: id
          title: title
          company: company
          location: location
          salary:
            min: 0
            max: 6
            currency: currency
          employmentType: employmentType
          postedDate: postedDate
          description: description
          url: url
          matchScore: 1.4658129805029452
        totalResults: 5
        page: 5
        pageSize: 2
      properties:
        jobs:
          items:
            $ref: "#/components/schemas/Job"
          type: array
        totalResults:
          format: int32
          type: integer
        page:
          format: int32
          type: integer
        pageSize:
          format: int32
          type: integer
      type: object
