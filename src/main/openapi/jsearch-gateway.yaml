openapi: 3.0.1
info:
  title: JSearch Gateway API
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:8102
paths:
  /api/v1/jsearch/jobs/search:
    post:
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JSearchSearchRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JSearchSearchResponse"
          description: OK
      summary: Search JSearch jobs for job-service
      tags:
      - JSearch Jobs
      x-content-type: application/json
      x-accepts:
      - '*/*'
  /internal/provider-mode:
    get:
      operationId: providerMode
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: object
                type: object
          description: OK
      tags:
      - provider-mode-controller
      x-accepts:
      - '*/*'
components:
  schemas:
    JSearchSearchRequest:
      example:
        targetRole: targetRole
        location: location
        remoteOnly: true
        cursor: cursor
      properties:
        targetRole:
          type: string
        location:
          type: string
        remoteOnly:
          type: boolean
        cursor:
          type: string
      type: object
    JSearchApplyOption:
      example:
        publisher: publisher
        applyUrl: applyUrl
        direct: true
      properties:
        publisher:
          type: string
        applyUrl:
          type: string
        direct:
          type: boolean
      type: object
    JSearchJob:
      example:
        externalJobId: externalJobId
        title: title
        companyName: companyName
        publisher: publisher
        description: description
        employmentType: employmentType
        locationDisplayName: locationDisplayName
        city: city
        state: state
        country: country
        salaryCurrency: salaryCurrency
        salaryPeriod: salaryPeriod
        postedAt: postedAt
        expiresAt: expiresAt
        primaryApplyUrl: primaryApplyUrl
        latitude: 0.8008281904610115
        longitude: 6.027456183070403
        salaryMinimum: 1
        salaryMaximum: 5
        remote: true
        directApply: true
        applyOptions:
        - publisher: publisher
          applyUrl: applyUrl
          direct: true
        - publisher: publisher
          applyUrl: applyUrl
          direct: true
      properties:
        externalJobId:
          type: string
        title:
          type: string
        companyName:
          type: string
        publisher:
          type: string
        description:
          type: string
        employmentType:
          type: string
        locationDisplayName:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        salaryCurrency:
          type: string
        salaryPeriod:
          type: string
        postedAt:
          type: string
        expiresAt:
          type: string
        primaryApplyUrl:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        salaryMinimum:
          format: int32
          type: integer
        salaryMaximum:
          format: int32
          type: integer
        remote:
          type: boolean
        directApply:
          type: boolean
        applyOptions:
          items:
            $ref: "#/components/schemas/JSearchApplyOption"
          type: array
      type: object
    JSearchSearchResponse:
      example:
        provider: provider
        cursor: cursor
        jobs:
        - externalJobId: externalJobId
          title: title
          companyName: companyName
          publisher: publisher
          description: description
          employmentType: employmentType
          locationDisplayName: locationDisplayName
          city: city
          state: state
          country: country
          salaryCurrency: salaryCurrency
          salaryPeriod: salaryPeriod
          postedAt: postedAt
          expiresAt: expiresAt
          primaryApplyUrl: primaryApplyUrl
          latitude: 0.8008281904610115
          longitude: 6.027456183070403
          salaryMinimum: 1
          salaryMaximum: 5
          remote: true
          directApply: true
          applyOptions:
          - publisher: publisher
            applyUrl: applyUrl
            direct: true
          - publisher: publisher
            applyUrl: applyUrl
            direct: true
        - externalJobId: externalJobId
          title: title
          companyName: companyName
          publisher: publisher
          description: description
          employmentType: employmentType
          locationDisplayName: locationDisplayName
          city: city
          state: state
          country: country
          salaryCurrency: salaryCurrency
          salaryPeriod: salaryPeriod
          postedAt: postedAt
          expiresAt: expiresAt
          primaryApplyUrl: primaryApplyUrl
          latitude: 0.8008281904610115
          longitude: 6.027456183070403
          salaryMinimum: 1
          salaryMaximum: 5
          remote: true
          directApply: true
          applyOptions:
          - publisher: publisher
            applyUrl: applyUrl
            direct: true
          - publisher: publisher
            applyUrl: applyUrl
            direct: true
      properties:
        provider:
          type: string
        cursor:
          type: string
        jobs:
          items:
            $ref: "#/components/schemas/JSearchJob"
          type: array
      type: object
